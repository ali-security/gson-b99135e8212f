name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: Print test results summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re
          import xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          for f in sorted(glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  total += 1
                  cls, name = tc.get('classname'), tc.get('name')
                  if tc.find('failure') is not None:
                      fail += 1
                      print('FAILURE: %s.%s' % (cls, name))
                  elif tc.find('error') is not None:
                      err += 1
                      print('ERROR: %s.%s' % (cls, name))
                  elif tc.find('skipped') is not None:
                      skip += 1
                      reason = tc.find('skipped').get('message') or ''
                      method = re.sub(r'\[.*$', '', name)
                      src = glob.glob('**/src/test/java/' + cls.replace('.', '/') + '.java', recursive=True)
                      if src:
                          m = re.search(r'void\s+' + re.escape(method) + r'\s*\(.*?\{(.*?)\n  \}', open(src[0]).read(), re.S)
                          if m:
                              hits = [l.strip() for l in m.group(1).splitlines() if 'assume' in l or 'Ignore' in l]
                              reason = (reason + ' ' + ' '.join(hits)).strip()
                      print('SKIPPED: %s.%s -- %s' % (cls, name, reason or 'no message'))
          print('TEST SUMMARY: Tests run: %d, Passed: %d, Failures: %d, Errors: %d, Skipped: %d'
                % (total, total - fail - err - skip, fail, err, skip))
          EOF
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-[0-9]*[0-9].jar
          if-no-files-found: error
